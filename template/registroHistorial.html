<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../styles/registro.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="../scripts/menu.js"></script>
    <script src="../scripts/registroHistorial.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>Sistema medico - Reg Historial</title>
</head>
<body>
    <header>
        <nav id="menu">
            <h1>Sistema medico</h1>
        </nav>
    </header>

    <div class="registro-container-principal">
        <div class="registro-container">
            <h2 class="titulo-formulario">📋 Registro de Historial Clínico (NOM-004-SSA3-2012)</h2>

            <form id="registro-form">
                <!-- Sección: Identificación -->
                <div class="form-section">
                    <h3 class="section-title">🧑 Datos de identificación</h3>
                    <div class="form-grid">
                        <input type="text" class="form-control" id="nombre" placeholder="Nombre(s)">
                        <input type="text" class="form-control" id="paterno" placeholder="Apellido paterno">
                        <input type="text" class="form-control" id="materno" placeholder="Apellido materno">
                        <input type="text" class="form-control" id="curp" placeholder="CURP">
                        <input type="text" class="form-control" id="RFC" placeholder="RFC">
                        <input type="date" class="form-control" id="fechaNacimiento" placeholder="Fecha de nacimiento">
                        <select class="form-control" id="sexo-menu">
                            <option value="">Selecciona el sexo</option>
                        </select>
                        <input type="text" class="form-control" id="ocupacion" placeholder="Ocupación">
                    </div>
                </div>

                <div class="form-section">
                    <h3 class="section-title">👨‍👩‍👧‍👦 Tutor legal</h3>
                    <div class="form-grid">
                        <input type="text" class="form-control" id="nombreResponsable" placeholder="Nombre del responsable">
                        <input type="text" class="form-control" id="parentesco" placeholder="Parentesco">
                        <input type="text" class="form-control" id="curpTutor" placeholder="CURP del tutor">
                        <input type="text" class="form-control" id="telefonoResponsable" placeholder="Teléfono del responsable">
                        <input type="text" class="form-control" id="identificacion" placeholder="Identificación del tutor">
                    </div>
                </div>

                <div class="form-section">
                    <h3 class="section-title">📝 Datos de la Consulta</h3>
                    <div class="form-grid">
                        <input type="date" class="form-control" id="fechaConsulta" placeholder="Fecha de consulta">
                        <select class="form-control" id="servicio-menu">
                            <option value="">Selecciona el servicio</option>
                        </select>
                        <select class="form-control" id="medico-menu">
                            <option value="">Medico responsable</option>
                        </select>
                        <input type="text" class="form-control" id="cedula" placeholder="Cedula profesional del medico" readonly>
                    </div>
                </div>

                <div class="form-section">
                    <h3 class="section-title">📝 Motivo y antecedentes</h3>
                    
                    <div class="form-grid-1">
                    
                            <input type="text" class="form-control" id="motivoConsulta" placeholder="Motivo de la consulta">    
                        
                        
                        <input type="text" class="form-control" id="antecedentesFamiliares" placeholder="Antecedentes heredo familiares">
                        <input type="text" class="form-control" id="antecedentesPersonales" placeholder="Antecedentes personales patológicos">
                        <input type="text" class="form-control" id="antecedentesNoPatologicos" placeholder="Antecedentes personales no patológicos">
                    </div>

                </div>

                <div class="form-section">
                    <h3 class="section-title">📝 Antecedentes Gineco-Obstétricos</h3>
                    <div class="form-grid">
                        <input type="number" class="form-control" id="menarquia" placeholder="Menarquia (años)" min="0">
                        <select class="form-control" id="cicloMenstrual">
                            <option value="">Ciclo menstrual</option>
                            <option value="regular">Regular</option>
                            <option value="irregular">Irregular</option>
                        </select>
                        <input type="date" class="form-control" id="fum" placeholder="FUM (Fecha Última Menstruación)">
                        <input type="number" class="form-control" id="gestas" placeholder="G (Embarazos)" min="0">
                        <input type="number" class="form-control" id="partos" placeholder="P (Partos)" min="0">
                        <input type="number" class="form-control" id="cesareas" placeholder="C (Cesáreas)" min="0">
                        <input type="number" class="form-control" id="abortos" placeholder="A (Abortos)" min="0">
                        <input type="text" class="form-control" id="metodoAnticonceptivo" placeholder="Método anticonceptivo">
                    </div>
                    <div class="form-grid-1" style="margin-top: 1rem;">
                        <textarea class="form-control" id="observacionesGinecologicas" placeholder="Observaciones ginecológicas" rows="3"></textarea>
                    </div>
                </div>

                <div class="form-submit">
                    <button type="submit" class="btn btn-primary" id="guardarHistorialBtn">Guardar Historial Clínico</button>
                </div>

            </form>
        </div>
    </div>
</body>
</html>

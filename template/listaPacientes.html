<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../styles/listaPacientes.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="../scripts/menu.js"></script>
    <script src="../scripts/listaPacientes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Sistema medico -Listado de Pacientes</title>
</head>
<body>
    <header>
        <nav id="menu">
            <h1>Sistema medico</h1>
        </nav>
    </header>

    
    <div class="registro-container-principal">
        <div class="registro-container">
            <h2 class="lista-title">👥 Lista de Pacientes Registrados</h2>
            <div class="busqueda-container">
                <input
                    type="text"
                    id="buscarPacienteInput"
                    class="form-control"
                    placeholder="Buscar paciente por nombre, CURP, RFC, teléfono o correo"
                    aria-label="Buscar paciente"
                >
            </div>
            <div class="tabla-container">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido Paterno</th>
                            <th>Apellido Materno</th>
                            <th>Fecha de Nacimiento</th>
                            <th>Sexo</th>
                            <th>Tipo sangre</th>
                            <th>Estado Civil</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Institución</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="pacientes-table-body">
                        
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="pacienteModal" tabindex="-1" aria-labelledby="pacienteModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="pacienteModalLabel">Detalles del paciente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <h6 id="modalPacienteNombre" class="mb-3"></h6>
                    <ul class="list-group list-group-flush" id="modalPacienteDatos"></ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="modalModificarBtn">Modificar</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
